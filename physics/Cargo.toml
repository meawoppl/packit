[package]
name = "physics"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
shared = { path = "../shared" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bytemuck = "1.25.2"
futures-channel = "0.3.34"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "webgpu", "wgsl"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
js-sys = "0.3.105"
wasm-bindgen-test = "0.3.78"
web-sys = { version = "0.3.105", features = ["Window", "Navigator"] }
