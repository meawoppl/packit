[package]
name = "frontend"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.105", features = ["AbortController", "Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "CredentialCreationOptions", "CredentialRequestOptions", "CredentialsContainer", "CssStyleDeclaration", "Document", "DomRect", "Element", "Event", "File", "FileList", "History", "HtmlAnchorElement", "HtmlCanvasElement", "HtmlDialogElement", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "Location", "Navigator", "NodeList", "Performance", "PointerEvent", "RequestCredentials", "Url", "WheelEvent", "Window"] }
gloo-net = "0.6"
serde = { version = "1", features = ["derive"] }
shared = { path = "../shared" }
uuid = "1.26.1"
chrono = "0.4.45"

js-sys = "0.3"
physics = { path = "../physics" }
solver = { path = "../solver" }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
gloo-render = "0.3.0"
gloo-events = "0.3.0"
gloo-timers = { version = "0.4.0", features = ["futures"] }
base64 = "0.22"

[target.wasm32-unknown-unknown.dev-dependencies]
wasm-bindgen-test = "0.3.78"
web-sys = { version = "0.3", features = ["PointerEvent", "PointerEventInit", "Node", "HtmlElement", "Document", "Window", "Navigator", "Element", "DomRect", "HtmlCanvasElement", "KeyboardEventInit", "WheelEventInit", "EventInit"] }
