name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every 5 days to keep the Swatinem/rust-cache warm (caches expire
    # after 7 days of inactivity).
    - cron: '0 0 */5 * *'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  lint:
    name: Lint Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check migration naming convention
        run: ./scripts/check-migration-names.sh

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        run: cargo audit

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy"

      - name: Install trunk
        run: cargo install trunk --locked

      - name: Build frontend (required for backend embed)
        run: cd frontend && trunk build

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Run Clippy (wasm crates)
        run: cargo clippy -p frontend -p physics -p solver -p shared --target wasm32-unknown-unknown --locked

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: packit_test
          POSTGRES_USER: packit
          POSTGRES_PASSWORD: dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U packit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"

      - name: Install trunk
        run: cargo install trunk --locked

      - name: Build frontend (required for backend embed)
        run: cd frontend && trunk build

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test browser physics fallback
        run: node --test physics/engine.test.js

      - name: Run tests
        run: cargo test --workspace --locked
        env:
          TEST_DATABASE_URL: postgresql://packit:dev_password@localhost:5432/packit_test

      - name: Install Chrome and matching driver
        uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Install WASM test runner
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked

      - name: Test Rust WebGPU physics in Chrome
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          WASM_BINDGEN_USE_BROWSER: "1"
          WASM_BINDGEN_TEST_TIMEOUT: "60"
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ github.workspace }}/physics/webdriver-ci.json
        run: |
          python3 - <<'PYTHON'
          import json, os
          with open('physics/webdriver.json') as f:
              config = json.load(f)
          config['goog:chromeOptions']['binary'] = os.environ['CHROME_BINARY']
          with open(os.environ['WASM_BINDGEN_TEST_WEBDRIVER_JSON'], 'w') as f:
              json.dump(config, f)
          PYTHON
          cargo test -p physics --target wasm32-unknown-unknown --lib --locked
